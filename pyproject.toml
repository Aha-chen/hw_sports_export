[project]
name = "huawei-health-export-tool"
version = "0.1.0"
description = "将华为运动健康导出的加密 ZIP 转换为 Strava 兼容的 TCX 文件"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "aiofiles==23.2.1",
    "fastapi==0.140.7",
    "httpx==0.27.2",
    "itsdangerous>=2.1.0",
    "jinja2==3.1.6",
    "python-dotenv>=1.0.0",
    "python-multipart==0.0.32",
    "pyzipper==0.4.0",
    "timezonefinder>=6.2.0",
    "tzdata>=2024.1",
    "uvicorn==0.24.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "ruff==0.16.0",
]

[tool.uv]
package = false
required-version = ">=0.11.32"

[tool.pytest.ini_options]
# package = false 时项目不会装进 venv；显式加入仓库根，保证 CI/uv run 能 import core、app。
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
