# 单机公网部署示例。生产环境仍应在外层配置 TLS、访问控制和日志留存策略。
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 按来源 IP 限制并发连接和任务创建速率，避免单个客户端耗尽解析资源。
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_req_zone $binary_remote_addr zone=parse_rate:10m rate=2r/m;

    upstream huawei_export_api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # 必须在 FastAPI 解析 multipart 前拒绝超限请求。
        client_max_body_size 2g;
        client_body_timeout 60s;
        send_timeout 1800s;

        location = /api/parse {
            limit_conn per_ip 2;
            limit_req zone=parse_rate burst=2 nodelay;

            # 流式转发上传，避免 Nginx 再完整缓存一份健康数据归档。
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
            proxy_pass http://huawei_export_api;
        }

        location /api/parse/progress/ {
            limit_conn per_ip 10;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1800s;
            proxy_pass http://huawei_export_api;
        }

        location / {
            limit_conn per_ip 10;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_pass http://huawei_export_api;
        }
    }
}

